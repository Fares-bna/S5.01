cat > pyproject.toml <<'EOF'
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E = erreurs de style pycodestyle, F = erreurs de code (import inutilisé, variable non définie)
select = ["E", "F"]
# E501 (ligne trop longue) ignoré : le code existant a des commentaires longs
ignore = ["E501"]

[tool.pytest.ini_options]
# permet "from pipeline..." et "from benchmark..." depuis n'importe où
pythonpath = ["."]
# les tests de l'API ont besoin de la base : ils se lancent à part, depuis api/ (voir README)
testpaths = ["pipeline", "benchmark"]
EOF
python -m pip install -r requirements-dev.txt -r pipeline/requirements.txt
ruff check . && python -m pytest
